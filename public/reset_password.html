<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set a new password | addyPets</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 flex items-center justify-center p-6 text-slate-900">
    <main class="w-full max-w-md rounded-xl bg-white p-8 shadow">
      <h1 class="text-2xl font-bold text-teal-800">Set a new password</h1>
      <p class="mt-2 text-sm text-slate-600">Choose a password with at least 8 characters.</p>
      <form id="resetForm" class="mt-6 space-y-4">
        <label class="block text-sm font-medium">New password
          <input id="password" class="mt-1 w-full rounded border p-3" type="password" minlength="8" required autocomplete="new-password" />
        </label>
        <label class="block text-sm font-medium">Confirm new password
          <input id="confirmPassword" class="mt-1 w-full rounded border p-3" type="password" minlength="8" required autocomplete="new-password" />
        </label>
        <button class="w-full rounded bg-teal-700 p-3 font-semibold text-white" type="submit">Update password</button>
      </form>
      <p id="message" class="mt-4 text-sm" role="status"></p>
    </main>
    <script>
      document.getElementById('resetForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const token = new URLSearchParams(window.location.search).get('token');
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const message = document.getElementById('message');
        if (!token || password !== confirmPassword) {
          message.textContent = !token ? 'This reset link is invalid.' : 'The passwords do not match.';
          message.className = 'mt-4 text-sm text-red-700';
          return;
        }
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await response.json();
        message.textContent = data.message;
        message.className = `mt-4 text-sm ${response.ok ? 'text-green-700' : 'text-red-700'}`;
        if (response.ok) setTimeout(() => { window.location.href = '/vet_portal_login.html'; }, 1500);
      });
    </script>
  </body>
</html>
